# Yazi theme — blue base with orange accents (matches kitty/waybar/wofi)
# Docs: https://yazi.dev/docs/configuration/theme

[theme]
background = "#0B1B2B"
foreground = "#C5D6E8"
muted      = "#2C4A6E"
warning    = "#FFC785"
error      = "#FF8A5C"
hint       = "#4FA8D8"
metadata   = "#5FD3C4"

[theme.mgr]
cwd       = { fg = "#FF9E3D" }
selection = { reverse = true }
hovered   = { bg = "#1E3A5F" }

[theme.mgr.tab]
bg       = "#0B1B2B"
active   = { bg = "#FF9E3D", fg = "#0B1B2B" }
inactive = { bg = "#14283D", fg = "#C5D6E8" }

[theme.mgr.border]
normal      = { fg = "#1E3A5F" }
focused     = { fg = "#4FA8D8" }
highlighted = { fg = "#FF9E3D" }

[theme.mgr.highlighter]
folder     = { fg = "#4FA8D8", bold = true }
executable = { fg = "#6FCF97" }
image      = { fg = "#FFC785" }
video      = { fg = "#D6B7E0" }
audio      = { fg = "#8CEFE2" }
archive    = { fg = "#FF9E3D" }
code       = { fg = "#79C6F2" }
special    = { fg = "#5FD3C4" }

[theme.input]
border    = { fg = "#4FA8D8" }
cursor    = { fg = "#0B1B2B", bg = "#FF9E3D" }
selection = { fg = "#FFC785" }

[theme.confirm]
bg    = "#0B1B2B"
title = { fg = "#FF9E3D" }
error = { fg = "#FF8A5C" }

[theme.toast]
bg     = "#102236"
border = { fg = "#1E3A5F" }
title  = { fg = "#FF9E3D" }
info   = { fg = "#79C6F2" }
error  = { fg = "#FF8A5C" }
warn   = { fg = "#FFC785" }

[theme.select]
bg     = "#0B1B2B"
border = { fg = "#4FA8D8" }
title  = { fg = "#FF9E3D" }
info   = { fg = "#79C6F2" }

[theme.task]
running = { fg = "#79C6F2" }
done    = { fg = "#6FCF97" }
error   = { fg = "#FF8A5C" }
