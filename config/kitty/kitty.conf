# Blue & Orange theme for kitty
# Blue as the base / background, orange for highlights & accents

# --- Core colors ---
foreground            #C5D6E8
background            #0B1B2B
selection_foreground  #0B1B2B
selection_background  #FF9E3D

# --- Cursor ---
cursor                #FF9E3D
