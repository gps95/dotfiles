# --- URL / links ---
url_color             #FFB166

# --- Window borders ---
active_border_color   #FF9E3D
inactive_border_color #1E3A5F
bell_border_color     #FFB166

# --- Tab bar ---
active_tab_foreground   #0B1B2B
active_tab_background   #FF9E3D
inactive_tab_foreground #C5D6E8
inactive_tab_background #14283D
