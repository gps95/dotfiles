<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Default to Iosevka system-wide.
  IosevkaTerm is the family name of the Nerd Font build (kitty uses it too).
  Fallback to plain "Iosevka" if only the non-Term variant is installed.
  Note: some apps hardcode their own fonts (e.g. kitty.conf, editor UIs);
  this covers everything that asks for generic sans/serif/mono.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>IosevkaTerm</family>
      <family>Iosevka</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>IosevkaTerm</family>
      <family>Iosevka</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>IosevkaTerm</family>
      <family>Iosevka</family>
    </prefer>
  </alias>
</fontconfig>
