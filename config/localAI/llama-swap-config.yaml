# ${PORT} is assigned automatically
# llama-server binary is at /app/llama-server in the vulkan image.

healthCheckTimeout: 300
globalTTL: 300

# num_ctx: 16k-16384 ; 32k-32768 ; 64k-65536 ; 128k-131072 ; 256k-262144

models:      
  qwen3.6-fastchat:
    cmd: >-
      /app/llama-server
      --model /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --port ${PORT}
      
      --n-gpu-layers 999
      --n-cpu-moe 18

      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0

      --ctx-size 16384
      
  qwen3.6-general:
    cmd: >-
      /app/llama-server
      --model /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --port ${PORT}
      
      --n-gpu-layers 999
      --n-cpu-moe 25

      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0

      --ctx-size 131072
      
  qwen3-coder:
    cmd: >-
      /app/llama-server
      --model /models/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
      --port ${PORT}
      
      --n-gpu-layers 999
      --n-cpu-moe 20
      
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0

      --ctx-size 32768
