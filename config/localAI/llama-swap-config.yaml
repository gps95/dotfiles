# ${PORT} is assigned automatically
# llama-server binary is at /app/llama-server in the vulkan image.

healthCheckTimeout: 300
globalTTL: 300

# num_ctx: 32k-32768 ; 64k-65536 ; 128k-131072 ; 256k-262144

models:
  qwen3.6:
    cmd: >-
      /app/llama-server
      --model /models/qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --port ${PORT}
      --n-gpu-layers 999
      --ctx-size 65536
      --n-cpu-moe 25

