services:     
  # ---- LLama Swap ----
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:unified-vulkan
    container_name: llama-swap
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./aimodels:/models
      - ./llama-swap-config.yaml:/etc/llama-swap/config/config.yaml #hot reloads on config change
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    networks: [ai]

  # ---- Pi agent harness ----
  pi:
    profiles: [tools]            # not started by a plain "docker compose up"
    container_name: pi
    image: pi-sandbox
    build:
      context: ./pi
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    user: "${PI_UID}:${PI_GID}"
    working_dir: /workspace
    volumes:
      - ${PI_WORKDIR:-.}:/workspace
      - ./pi-home:/home/pi/.pi
      - pi-npm:/home/pi/.npm-global
    networks: [ai]

volumes:
  pi-npm:

networks:
  ai:

