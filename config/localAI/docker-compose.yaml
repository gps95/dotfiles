services:
  # ---- Chat UI, talks to llama-server via OpenAI-compatible API ----
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - ./data/open-webui:/app/backend/data
    environment:
      OPENAI_BASE_URL: "http://llama-swap:8080/v1"
      OPENAI_API_KEY: "nokey"
      WEBUI_AUTH: "true"
    depends_on:
      - llama-swap

  # ---- Image / video generation (Krea 2, Wan, etc.) ----
  comfyui:
    image: yanwk/comfyui-boot:${COMFYUI_IMAGE_TAG}
    container_name: comfyui
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "8188:8188"
    volumes:
      - ./data/comfyui:/root
    environment:
      HSA_OVERRIDE_GFX_VERSION: "${HSA_OVERRIDE_GFX_VERSION}"
      CLI_ARGS: ""
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host

  # ---- LLM inference (llama-swap proxy + llama-server ROCm) ----
  # Models defined in 
  llama-swap:
    build: ./llama-swap
    container_name: llama-swap
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./aimodels:/models
      - ./llama-swap/config.yaml:/config/config.yaml #hot reloads on config change
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    security_opt:
      - seccomp=unconfined
    ipc: host

networks:
  default:
    name: dockerAINetwork
