services:     
  # ---- LLama Swap ----
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:unified-vulkan
    container_name: llama-swap
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./aimodels:/models
      - ./llama-swap-config.yaml:/etc/llama-swap/config/config.yaml #hot reloads on config change
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    networks: [ai]

  # ---- Pi agent harness ----
  pi:
    profiles: [tools]            # not started by a plain "docker compose up"
    container_name: pi
    image: pi-sandbox
    build:
      context: ./pi
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    user: "${PI_UID}:${PI_GID}"
    working_dir: /workspace
    volumes:
      - ${PI_WORKDIR:-.}:/workspace
      - ./pi-home:/home/pi/.pi
      - pi-npm:/home/pi/.npm-global
      - /run/user/1000/pulse:/run/pw/pulse # host PipeWire/Pulse socket (mic); verify `native` exists
      - /run/user/1000/bus:/run/user/1000/bus # host session D-Bus -> host desktop notifications (notify.ts); recreate container after login changes
    mem_limit: 3g
    networks: [ai]

  # ---- STT: whisper.cpp server on cpu ----
  whisper:
    profiles: [tools]
    container_name: whisper
    image: ghcr.io/ggml-org/whisper.cpp:main
    network_mode: "service:pi"
    entrypoint: ["whisper-server"]
    restart: unless-stopped
    depends_on: [pi]
    volumes:
      - ./whisper-models:/models:ro
    mem_limit: 4g
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8788"
      - -t
      - "4"
      - -m
      - /models/ggml-large-v3-turbo.bin
      - --inference-path
      - /v1/audio/transcriptions
      - --convert
      - -l
      - auto

volumes:
  pi-npm:

networks:
  ai:

